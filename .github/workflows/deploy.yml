name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @jxp/ui run build
          pnpm --filter @jxp/graphql-client run build

      - name: Build Partner Hub
        run: pnpm --filter @jxp/partner-hub run build

      - name: Build Next.js Website (Static Export)
        env:
          GITHUB_ACTIONS: 'true'
          DEPLOY_TARGET: 'gh-pages'
        run: pnpm --filter @jxp/web run build

      - name: Bundle Partner Hub into Website and Add .nojekyll
        run: |
          mkdir -p ./apps/web/out/partner-hub
          cp -r ./apps/partner-hub/dist/* ./apps/web/out/partner-hub/
          touch ./apps/web/out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
