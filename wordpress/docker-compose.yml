services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: jxp-wordpress-db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-jxp_wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-jxp_user}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-jxp_secure_password}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-jxp_root_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jxp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WORDPRESS_DB_ROOT_PASSWORD:-jxp_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Headless WordPress (PHP 8.2 / Apache)
  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: jxp-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-jxp_wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-jxp_user}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-jxp_secure_password}
      WORDPRESS_CONFIG_EXTRA: |
        /* Headless & WPGraphQL settings */
        define('WP_HOME', 'http://localhost:${WORDPRESS_PORT:-8080}');
        define('WP_SITEURL', 'http://localhost:${WORDPRESS_PORT:-8080}');
        define('GRAPHQL_JWT_AUTH_SECRET_KEY', '${GRAPHQL_JWT_AUTH_SECRET_KEY:-change_me_to_a_secure_random_string_in_production}');
        /* Enable CORS for Headless Frontend clients */
        header("Access-Control-Allow-Origin: *");
        header("Access-Control-Allow-Methods: POST, GET, OPTIONS, PUT, DELETE");
        header("Access-Control-Allow-Headers: Authorization, Content-Type, X-Requested-With");
        if (isset($$_SERVER['REQUEST_METHOD']) && 'OPTIONS' === $$_SERVER['REQUEST_METHOD']) {
            header("HTTP/1.1 200 OK");
            exit();
        }
    volumes:
      - wp_data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - jxp-network

  # phpMyAdmin Web GUI
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jxp-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-jxp_root_password}
      UPLOAD_LIMIT: 128M
    networks:
      - jxp-network

  # FastAPI Backend Service (Dashboard Logic & Billing)
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: jxp-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WPGRAPHQL_ENDPOINT: http://wordpress:80/graphql
      WP_JWT_SECRET: ${WP_JWT_SECRET:-super_secret_jxp_jwt_key_for_dev_only}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      DATABASE_URL: sqlite:///./jxp.db
    volumes:
      - ../services/api:/app
    networks:
      - jxp-network

volumes:
  db_data:
    driver: local
  wp_data:
    driver: local

networks:
  jxp-network:
    driver: bridge
